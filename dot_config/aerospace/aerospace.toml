# AeroSpace configuration
# Mirrors Hyprland Super-key workflow, using physical Cmd as the modifier.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]

# --- Launchers ---
# Terminal: change the app name here to switch your default terminal
cmd-enter = 'exec-and-forget open -a cmux'
# Browser
cmd-b = 'exec-and-forget open -a Orion'

# --- Workspace switching (Cmd + number) ---
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

# --- Move window to workspace (Cmd + Shift + number) ---
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 10'

# --- Focus movement (Cmd + arrows) ---
cmd-left = 'focus left'
cmd-down = 'focus down'
cmd-up = 'focus up'
cmd-right = 'focus right'

# --- Move focused window within workspace (Cmd + Ctrl + arrows) ---
cmd-ctrl-left = 'move left'
cmd-ctrl-down = 'move down'
cmd-ctrl-up = 'move up'
cmd-ctrl-right = 'move right'

# --- Resize focused window (Cmd + Shift + arrows) ---
cmd-shift-left = 'resize width -50'
cmd-shift-right = 'resize width +50'
cmd-shift-up = 'resize height -50'
cmd-shift-down = 'resize height +50'
